name: Build & Test Debug

on:
  push:
    branches: [main, staging, stable, 'ci/benchmark-*']
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, staging, stable]
  workflow_dispatch:
    inputs:
      integration-shards:
        description: Number of independent integration test runners
        type: choice
        options: ['1', '2', '4']
        default: '2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 10.0.x
      - name: Verify test planning and coverage checks
        run: python3 -m unittest discover -s Tools/_WH40K -p test_ci_tests.py -v
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore dependencies
        run: dotnet restore
      - name: Build DebugOpt
        run: dotnet build --configuration DebugOpt --no-restore /p:WarningsAsErrors=nullable /m
      - name: Restore test durations
        uses: actions/cache/restore@v4
        with:
          path: test_results/timings.json
          key: ${{ runner.os }}-test-durations-v1-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-test-durations-v1-
      - name: Discover tests and prepare groups
        id: plan
        env:
          SHARDS: ${{ inputs.integration-shards || '1' }}
        run: python3 Tools/_WH40K/ci_tests.py prepare --shards "$SHARDS" --output test_results/plan --timings test_results/timings.json
      - name: Archive test runtime
        run: tar -czf test-runtime.tar.gz bin/Content.Tests bin/Content.IntegrationTests
      - name: Upload test runtime
        uses: actions/upload-artifact@v4
        with:
          name: test-runtime
          path: test-runtime.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Upload discovery plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-plan
          path: test_results/plan
          retention-days: 7

  tests:
    name: Tests (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: test-runtime
      - name: Extract test runtime
        run: tar -xzf test-runtime.tar.gz
      - uses: actions/download-artifact@v4
        with:
          name: test-plan
          path: test_results/plan
      - name: Run tests
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: python3 Tools/_WH40K/ci_tests.py run --plan test_results/plan/plan.json --group "$TEST_GROUP" --output test_results/runs
      - name: Upload test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.group }}
          path: test_results/runs
          retention-days: 7

  ci-success:
    name: Build & Test Debug
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [build, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: test-plan
          path: test_results/plan
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        continue-on-error: true
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test_results/runs
      - name: Verify all expected tests and write summary
        if: needs.build.result == 'success'
        run: python3 Tools/_WH40K/ci_tests.py report --plan test_results/plan/plan.json --results test_results/runs --timings test_results/timings.json
      - name: Save test durations from the default branch
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: test_results/timings.json
          key: ${{ runner.os }}-test-durations-v1-${{ github.run_id }}
      - name: Require successful build and all test jobs
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [[ "$BUILD_RESULT" != success || "$TEST_RESULT" != success ]]; then
            echo "::error::Build: $BUILD_RESULT; tests: $TEST_RESULT. See the failed job and test summary."
            exit 1
          fi

  shipyard-success:
    # Shipyard is included in the integration catalog on every run. Preserve the
    # existing check name for repositories that require it in branch protection.
    name: Build & Run Shipyard Tests
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: ci-success
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the complete integration suite
        env:
          RESULT: ${{ needs.ci-success.result }}
        run: test "$RESULT" = success
