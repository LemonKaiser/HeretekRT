name: No submodule update checker

on:
  pull_request:
    paths:
      - 'RobustToolbox'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  this_aint_right:
    name: Submodule update in pr found
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check approved engine revision
        env:
          APPROVED_ENGINE_REVISION: 39acdd5d3b67e48044366ef0cdb1d1c3b41cc85e # v278.0.4
        run: test "$(git rev-parse HEAD:RobustToolbox)" = "$APPROVED_ENGINE_REVISION"
