name: No submodule update checker

on:
  pull_request:
    paths:
      - 'RobustToolbox'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  this_aint_right:
    name: Submodule update in pr found
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check approved engine revision
        env:
          APPROVED_ENGINE_REVISION: d56b0d0bcf94c76bef7fc18625bf226607dca092 # v295.0.3
        run: test "$(git rev-parse HEAD:RobustToolbox)" = "$APPROVED_ENGINE_REVISION"
