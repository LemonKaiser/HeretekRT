#Heat
- type: entity
  parent: [BaseItem, ArmorPlateRepairableBase]
  id: ArmorPlateHeat
  name: diffusion armor plate
  description: A replaceable wear buffer for compatible armor. Takes thermal wear and part of radiation and electrical wear, without adding damage resistance.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: heat
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 150
    walkSpeedModifier: 0.90
    sprintSpeedModifier: 0.90
    damageToPlate:
      Piercing: 1.5
      Heat: 1
      Radiation: 0.5
      Shock: 0.5
    absorptionRatios:
      Heat: 1
      Radiation: 0.5
      Shock: 0.5
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
