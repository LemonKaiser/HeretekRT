        acts: [ "Destruction" ]

#Speed
- type: entity
  parent: [BaseItem, ArmorPlateRepairableBase]
  id: ArmorPlateSpeed
  name: speed armor plate
  description: A light replacement plate that increases movement speed and takes a quarter of physical and thermal armor wear.
  components:
  - type: Sprite
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    state: speed
  - type: Item
    sprite: _Mono/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 250
    walkSpeedModifier: 1.1
    sprintSpeedModifier: 1.1
    damageToPlate:
      Heat: 1
      Blunt: 1
      Slash: 1
      Piercing: 1
    absorptionRatios:
      Heat: 0.25
      Blunt: 0.25
      Slash: 0.25
      Piercing: 0.25
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250 # Bet you wish it broke faster before it ruined your day
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
