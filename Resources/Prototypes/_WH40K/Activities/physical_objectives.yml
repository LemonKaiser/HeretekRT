# Physical roots for stage 3. They are static single entities only: no temporary map, grid,
# player role, ghost takeover, NPC, loot or reward is embedded in a prototype.

- type: entity
  id: KoronusActivityVoxBeacon
  parent: BaseStructure
  name: vox survey beacon
  description: A hardened relay awaiting a manual auspex readout.
  components:
  - type: Sprite
    sprite: Objects/Tools/fulton.rsi
    drawdepth: SmallObjects
    noRot: true
    state: extraction_point
  - type: InteractionOutline
  - type: PointLight
    enabled: true
    color: "#77C8FF"
    radius: 3
    energy: 2
  - type: KoronusActivityObjective

- type: entity
  id: KoronusActivityRescueFlare
  parent: BaseStructure
  name: distress flare recorder
  description: Its final emergency log can still be read from the casing.
  components:
  - type: Sprite
    sprite: Objects/Misc/flare.rsi
    drawdepth: SmallObjects
    noRot: true
    state: flare_burn
  - type: InteractionOutline
  - type: PointLight
    enabled: true
    color: "#FF6A45"
    radius: 3
    energy: 2
  - type: KoronusActivityObjective

- type: entity
  id: KoronusActivityAuspexProbe
  parent: BaseStructure
  name: auspex probe
  description: A drifting probe awaits manual telemetry retrieval.
  components:
  - type: Sprite
    sprite: Objects/Tools/fulton.rsi
    drawdepth: SmallObjects
    noRot: true
    state: extraction_pack
  - type: InteractionOutline
  - type: PointLight
    enabled: true
    color: "#A68CFF"
    radius: 3
    energy: 2
  - type: KoronusActivityObjective
