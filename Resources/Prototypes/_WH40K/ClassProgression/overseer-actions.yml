- type: entity
  id: Wh40kClassCommandBeacon
  parent: DefaultStationBeaconUnanchored
  name: formation beacon
  categories: [ HideSpawnMenu ]

- type: entity
  abstract: true
  id: ActionWh40kOverseerInstantBase
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Devices/communication.rsi
      state: radio
    event: !type:Wh40kClassInstantActionEvent

- type: entity
  abstract: true
  id: ActionWh40kOverseerTargetBase
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    useDelay: 20
    itemIconStyle: BigAction
    whitelist:
      components:
      - MobState
    canTargetSelf: false
    interactOnMiss: false
    icon:
      sprite: Objects/Devices/communication.rsi
      state: radio
    event: !type:Wh40kClassEntityTargetActionEvent

- type: entity
  abstract: true
  id: ActionWh40kOverseerPointBase
  categories: [ HideSpawnMenu ]
  components:
  - type: WorldTargetAction
    useDelay: 20
    itemIconStyle: BigAction
    range: 10
    checkCanAccess: true
    icon:
      sprite: Objects/Devices/communication.rsi
      state: radio
    event: !type:Wh40kClassWorldTargetActionEvent

- type: entity
  id: ActionWh40kOverseerPriorityTarget
  parent: ActionWh40kOverseerTargetBase

- type: entity
  id: ActionWh40kOverseerTakeCover
