# Action that opens a cyborg's built-in PDA.
- type: entity
  id: Wh40kActionBorgOpenPda
  components:
  - type: InstantAction
    checkCanInteract: false
    itemIconStyle: NoItem
    icon:
      sprite: Objects/Devices/pda.rsi
      state: pda
    event: !type:ToggleIntrinsicUIEvent { key: enum.PdaUiKey.Key }
    useDelay: 0.5
