- type: entity
  id: MobHumanWH40KDialogueDummy
  parent: MobHuman
  name: dialogue dummy
  description: A test NPC for checking the WH40K dialogue scene.
  suffix: WH40K, Dialogue
  save: false
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
    hair: HairBald
  - type: Loadout
    prototypes:
    - LimitedPassengerGear
  - type: DialogueInteractable
    interactionRange: 3
    requireLineOfSight: true
    dialogues:
      - dialogue: WH40KDemoGreeting
      - chat: heretek-dialogue-state-locked-chat
        conditions:
          - type: CounterAtLeast
            counter: wh40k_demo_whiskey
            amount: 2
      - dialogue: WH40KDemoStateLoop
        conditions:
          - type: Flag
            flag: wh40k_demo_intro_done
            value: true

- type: entity
  id: MobQueenChrysalisImperiumDialogueFizzo
  parent: MobQueenChrysalisImperium
  name: Физзо
  description: wh40k-footfall-npc-fizzo-desc
  suffix: WH40K, Dialogue, Casino owner
  save: false
  components:
  - type: NpcFactionMember
    factions:
    - Passive
  - type: Wh40kNpcProtection
  - type: DialogueDisplayName
    name: Физзо
  - type: HTN
    rootTask:
      task: WH40KMerchantIdleCompound
    blackboard:
      MinimumIdleTime: !type:Single
        30
      MaximumIdleTime: !type:Single
        30
  - type: DialogueInteractable
    interactionRange: 3
    persistMemory: true
    persistentMemoryKey: wh40k_fizzo_bartender
    persistenceMode: Selected
    persistentFlags:
      - wh40k_fizzo_intro_done
    requireLineOfSight: true
    baseDialogue: WH40KFizzoBase
    dialogues:
      - dialogue: WH40KFizzoIntro
        conditions:
          - type: Flag
            flag: wh40k_fizzo_intro_done
            value: false
  - type: Wh40kNpcIdentity
    anchor: FootfallFizzo
  - type: Godmode
  - type: UserInterface
    interfaces:
      enum.MerchantUiKey.Key:
        type: MerchantBoundUserInterface
        interactionRange: 3
  - type: Merchant
    title: wh40k-service-fizzo-title
    greeting: wh40k-service-fizzo-intro
    refreshInterval: 900
    displayCount: 3
    offers:
    - product: DrinkGuardsmanFlask
      price: 18
      minStock: 2
      maxStock: 5
    - product: DrinkImperialNutriCan
      price: 22
      minStock: 2
      maxStock: 5
    - product: FoodSnackImperialNutriBar
      price: 18
      minStock: 2
      maxStock: 5

- type: entity
  id: MobHumanWH40KDialogueAutoDummy
  parent: MobHuman
  name: dialogue auto trigger dummy
  description: A test NPC for checking the WH40K dialogue auto trigger and line of sight.
  suffix: WH40K, Dialogue, Auto
  save: false
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
    hair: HairBald
  - type: Loadout
    prototypes:
    - LimitedPassengerGear
  - type: DialogueInteractable
    interactionRange: 3
    requireLineOfSight: true
    autoTrigger: true
    autoTriggerRange: 2.5
    dialogues:
      - dialogue: WH40KDemoGreeting
      - chat: heretek-dialogue-state-locked-chat
        conditions:
          - type: CounterAtLeast
            counter: wh40k_demo_whiskey
            amount: 2
      - dialogue: WH40KDemoStateLoop
        conditions:
          - type: Flag
            flag: wh40k_demo_intro_done
            value: true

