  suffix: WH40K, паломник
  components:
  - type: Sprite
    sprite: _WH40K/Clothing/OuterClothing/Robes/pilgrim_robe.rsi
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Clothing
    sprite: _WH40K/Clothing/OuterClothing/Robes/pilgrim_robe.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
