# Skitarii Vanguard & Ranger equipment

# Uniforms (both provide 60% radiation protection)
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitSkitariiVanguard
  suffix: WH40K, АдМехи
  components:
  - type: Sprite
    sprite: _WH40K/Clothing/Uniforms/Jumpsuit/skitarii_vanguard_uniform.rsi
  - type: Clothing
    sprite: _WH40K/Clothing/Uniforms/Jumpsuit/skitarii_vanguard_uniform.rsi
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Armor
    modifiers:
      coefficients:
        Radiation: 0.4

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitSkitariiRanger
  suffix: WH40K, АдМехи
  components:
  - type: Sprite
    sprite: _WH40K/Clothing/Uniforms/Jumpsuit/skitarii_ranger_uniform.rsi
  - type: Clothing
    sprite: _WH40K/Clothing/Uniforms/Jumpsuit/skitarii_ranger_uniform.rsi
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Armor
    modifiers:
      coefficients:
        Radiation: 0.4
  - type: ToggleableClothing
    action: ActionWH40KToggleSkitariiRangerHood
    verbText: ent-ActionWH40KToggleSkitariiRangerHood
    requiredSlot: innerclothing
    clothingPrototypes:
      head: ClothingHeadHoodSkitariiRanger
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container {}

- type: entity
  parent: WH40KClothingHeadToggleableHoodBase
  id: ClothingHeadHoodSkitariiRanger
  categories: [ HideSpawnMenu ]
  suffix: WH40K, АдМехи
  components:
  - type: Sprite
    sprite: _WH40K/Clothing/Head/Hoods/skitarii_ranger_hood.rsi
  - type: Clothing
    sprite: _WH40K/Clothing/Head/Hoods/skitarii_ranger_hood.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET

- type: entity
  parent: ActionToggleSuitPiece
  id: ActionWH40KToggleSkitariiRangerHood

# Ranger gasmask
- type: entity
  parent: [WH40KDurableHelmet, ClothingMaskBase]
  id: ClothingMaskGasSkitariiRanger
  suffix: WH40K, АдМехи
  components:
  - type: Item
    size: Tiny
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Sprite
    sprite: _WH40K/Clothing/Mask/skitarii_ranger_gasmask.rsi
  - type: Clothing
    sprite: _WH40K/Clothing/Mask/skitarii_ranger_gasmask.rsi
  - type: BreathMask
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: Tag
    tags:
    - HamsterWearable
    - PetWearable
    - WhitelistChameleon
  - type: HideLayerClothing
    layers:
      Snout: MASK
  - type: Armor
    modifiers:
      coefficients:
        Radiation: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.85

