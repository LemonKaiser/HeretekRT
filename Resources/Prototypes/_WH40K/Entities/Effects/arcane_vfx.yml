- type: entity
  abstract: true
  id: WH40KBaseArcaneVfx
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: false
  - type: TimedDespawn
    lifetime: 1
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  parent: WH40KBaseArcaneVfx
  id: WH40KEnergyMuzzlePulseEffect
  components:
  - type: TimedDespawn
    lifetime: 0.4
  - type: Sprite
    netsync: false
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _WH40K/Effects/arcane_vfx/pulse.rsi
      state: muzzle_pulse
  - type: EffectVisuals

- type: entity
  parent: WH40KBaseArcaneVfx
