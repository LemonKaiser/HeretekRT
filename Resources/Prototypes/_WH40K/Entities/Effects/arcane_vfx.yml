    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _WH40K/Effects/arcane_vfx/pulse.rsi
      state: impact_pulse
  - type: EffectVisuals

- type: entity
  parent: WH40KBaseArcaneVfx
  id: WH40KEnergyDivetMuzzleEffect
  components:
  - type: TimedDespawn
    lifetime: 0.25
  - type: Sprite
    netsync: false
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _WH40K/Effects/arcane_vfx/divet.rsi
      state: projectiles_divet
  - type: EffectVisuals
  - type: PointLight
    color: "#ffd25c"
    radius: 1.5
    energy: 3
    castShadows: false
  - type: LightFade
    duration: 0.24

- type: entity
  parent: WH40KBaseArcaneVfx
  id: WH40KCosmicArcImpactVfx
  components:
  - type: TimedDespawn
    lifetime: 0.66
  - type: Sprite
    netsync: false
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _WH40K/Effects/arcane_vfx/weaponarcs.rsi
      state: arc_cosmic
  - type: EffectVisuals
  - type: PointLight
    color: "#42a4ae"
    radius: 1.5
    energy: 6
    castShadows: false
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      interpolate: Linear
      minDuration: 0.64
      maxDuration: 0.65
      startValue: 0.1
      endValue: 6
      property: Energy
      enabled: true
      reverseWhenFinished: true

