# Cleaner servitors (seek and mop puddles like Cleanbot)
- type: entity
  id: MobWH40KServitorCleanerBase
  parent: MobWH40KServitorBase
  abstract: true
  suffix: WH40K, Сервиторы
  components:
  - type: Absorbent
    pickupAmount: 10
  - type: UseDelay
    delay: 2
  - type: SolutionRegeneration
    solution: absorbed
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 10
  - type: SolutionPurge
    solution: absorbed
    preserve:
    - Water
    quantity: 10
  - type: SolutionContainerManager
    solutions:
      absorbed:
        maxVol: 50
  - type: DrainableSolution
    solution: drainBuffer
  - type: HTN
    rootTask:
      task: CleanbotCompound

