- type: entity
  id: BaseMobWH40KTauInfantry
  parent: BaseMobWH40KChaosRanged
  abstract: true
  suffix: WH40K, Tau
  components:
  - type: NpcFactionMember
    factions: [TauEmpire]
  - type: Body
    prototype: Tau
    requiredLegs: 2
  - type: Gun
    fireRate: 1.2
    useKey: false
    selectedMode: SemiAuto
    availableModes: [SemiAuto]
    soundGunshot:
      path: /Audio/_WH40K/Weapons/Soundpack/Guns/lasfire_phased1.ogg
  - type: HitscanBatteryAmmoProvider
    proto: WH40KTauPulseRifleBeam
    fireCost: 100
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 500

- type: entity
  id: MobWH40KTauStrike
  parent: BaseMobWH40KTauInfantry
  components:
  - type: Sprite
    sprite: _WH40K/Mobs/Tau/strike.rsi
  - type: Wh40kChaosTactics
    retreatRange: 3.5

- type: entity
  id: BaseMobWH40KTauScout
  parent: BaseMobWH40KTauInfantry
  abstract: true
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Critical
      155: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.5
  - type: Wh40kInnateArmor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9

- type: entity
  id: MobWH40KTauPathfinder
  parent: BaseMobWH40KTauScout
  components:
  - type: Sprite
    sprite: _WH40K/Mobs/Tau/pathfinder.rsi
  - type: Gun
