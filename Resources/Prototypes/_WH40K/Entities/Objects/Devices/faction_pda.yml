- type: entity
  parent: BasePDA
  id: WH40KKasballicaPDA
  name: Kasballica PDA
  description: A personal data assistant marked with the insignia of the Kasballica Mission.
  suffix: WH40K, Kasballica
  categories: [ HideSpawnMenu ]
  components:
  - type: Wh40kQuestUi
  - type: UserInterface
    interfaces:
      enum.Wh40kQuestUiKey.Key:
        type: Wh40kQuestBoundUserInterface
        interactionRange: 3
  - type: Pda
    id: WH40KFootfallKasballicaIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-wh40k-kasballica
  - type: Icon
    state: pda-wh40k-kasballica
  - type: PdaBorderColor
    borderColor: "#A66B9E"

