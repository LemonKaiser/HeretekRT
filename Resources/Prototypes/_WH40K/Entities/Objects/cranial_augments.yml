- type: entity
  id: BaseWH40KCranialAugment
  parent: BaseHeretekAugment
  abstract: true
  components:
  - type: Cybernetics
  - type: Sprite
    sprite: _WH40K/Objects/Augments/augments.rsi
  - type: Item
    size: Small
  - type: Organ
    slotId: cranialAugment
  - type: Wh40kImplantSpec
    zones: [ Head ]

- type: entity
  id: WH40KAugmentIronJaw
  parent: BaseWH40KCranialAugment
  name: iron jaw
  description: A mechanical jaw fitted over the lower face.
  components:
  - type: Sprite
    state: ironjaw-icon
  - type: Organ
    onAdd:
    - type: Wh40kCranialAppearance
      marking: WH40KAugmentIronJawMarking

- type: entity
  id: WH40KAugmentIronSkull
  parent: BaseWH40KCranialAugment
  name: iron skull
  description: A metal cranial shell that encloses the head and leaves the internal organs in place.
  components:
  - type: Sprite
    state: ironscull-icon
  - type: Organ
    onAdd:
    - type: Wh40kCranialAppearance
      headSprite: WH40KAugmentIronSkullLayer

- type: entity
  id: WH40KAugmentSkitariiSkull
  parent: BaseWH40KCranialAugment
  name: Skitarii skull
  description: A cranial shell patterned after the augmetic heads of the Skitarii.
  components:
  - type: Sprite
    state: sikariiscull-icon
  - type: Organ
    onAdd:
    - type: Wh40kCranialAppearance
      headSprite: WH40KAugmentSkitariiSkullLayer

- type: marking
  id: WH40KAugmentIronJawMarking
  bodyPart: Head
  markingCategory: Overlay
  speciesRestriction: []
  sprites:
  - sprite: _WH40K/Objects/Augments/augments.rsi
    state: ironjaw

- type: humanoidBaseSprite
  id: WH40KAugmentIronSkullLayer
  matchSkin: false
  allowsMarkings: false
  baseSprite:
    sprite: _WH40K/Objects/Augments/augments.rsi
    state: ironscull

- type: humanoidBaseSprite
  id: WH40KAugmentSkitariiSkullLayer
  matchSkin: false
  allowsMarkings: false
  baseSprite:
    sprite: _WH40K/Objects/Augments/augments.rsi
    state: sikariiscull
