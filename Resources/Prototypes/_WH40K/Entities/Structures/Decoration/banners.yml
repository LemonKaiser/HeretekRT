- type: entity
  id: WH40KImperialFleetBanner
  parent: WHChaosBanner
  name: штандарт Имперского Военного Флота
  description: Чёрно-золотой штандарт командования Военного Флота. Он напоминает каждому экипажу, что звёзды принадлежат Трону.
