- type: entity
  id: WH40KImperialDecorSolidBase
  abstract: true
  parent: WH40KDecorPropBase
  components:
  - type: Physics
    canCollide: true

- type: entity
  id: WH40KDecorOmnissiahShrine
  parent: WH40KImperialDecorSolidBase
  name: придорожный алтарь Омниссии
  description: Небольшой алтарь машинного божества. Его ржавые шестерни помнят молитвы техножрецов и гул давно ушедших караванов.
  suffix: WH40K, Декорация
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Decorations/imperial_altar.rsi
    state: altar
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.32,-0.45,0.32,0.20"
        density: 190
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  id: WH40KDecorCogitatorDesk
  parent: WH40KImperialDecorSolidBase
  name: архивный когитаторный стол
  description: Пыльный рабочий стол писца. В его памяти ещё могут храниться приказы, которым уже несколько столетий.
  suffix: WH40K, Декорация
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Decorations/cogitator_desk.rsi
    state: cogitator_desk
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.90,-0.38,0.90,0.38"
        density: 190
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  id: WH40KDecorAuspexTerminal
  parent: WH40KImperialDecorSolidBase
  name: терминал ауспика
  description: Компактный пост наблюдения, сверяющий сигнатуры с давно устаревшими литаниями допуска.
  suffix: WH40K, Декорация
