- type: entity
  id: WH40KDecorCartographTable
  parent: WH40KImperialDecorSolidBase
  name: стол картографа крестового похода
  description: Длинный стол для звёздных карт и планов высадки. На его поверхности легко представить следы воска и крови.
  suffix: WH40K, Декорация
