          bounds: "-0.38,-0.40,0.38,0.25"
        density: 190
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  id: WH40KDecorCommandConsole
  parent: WH40KImperialDecorSolidBase
  name: консоль тактического хора
  description: Панель связи, где приказы офицера превращались в машинные гимны для всего корабля.
  suffix: WH40K, Декорация
