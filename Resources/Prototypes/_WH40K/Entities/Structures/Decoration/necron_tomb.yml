  suffix: WH40K, Dungeon
  components:
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _WH40K/Structures/Decorations/necron_pylon.rsi
    state: pylon
    offset: 0,0.65
    drawdepth: OverMobs
    visible: false
  - type: PointLight
    offset: 0,0.495
