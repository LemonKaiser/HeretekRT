- type: entity
  id: WH40KNecronTombObelisk
  parent: WH40KNecronDecorObelisk
  suffix: WH40K, Dungeon
  components:
  - type: Sprite
    offset: 0,0.5
    drawdepth: Mobs
  - type: Physics
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.28,-0.4,0.28,0.4"
        density: 250
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: PointLight
    radius: 4.5
    energy: 1.1
    color: "#64DA45"

- type: entity
  id: WH40KNecronTombPillar
  parent: WH40KNecronTombObelisk
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Decorations/necron_pillars.rsi
    state: six
    offset: 0,1
  - type: Icon
    sprite: _WH40K/Structures/Decorations/necron_pillars.rsi
    state: six
  - type: PointLight
    enabled: true
    radius: 4.5
    energy: 1.1

- type: entity
  id: WH40KNecronTombPillarAlt
  parent: WH40KNecronTombPillar
  components:
  - type: Sprite
    state: seven
  - type: Icon
    state: seven

- type: entity
  id: WH40KNecronTombPylon
