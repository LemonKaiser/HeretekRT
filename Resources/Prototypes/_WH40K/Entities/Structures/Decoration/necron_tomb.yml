    anchored: true
    noRot: true
  - type: Sprite
    drawdepth: Mobs
    color: "#91B39A"
  - type: Battery
    maxCharge: 1000000
    startingCharge: 750000
  - type: PointLight
    color: "#64DA45"

- type: entity
  id: WH40KNecronTombInductionCoil
