  - type: Sprite
    drawdepth: Mobs
    color: "#A4BAA2"
  - type: GenericVisualizer
    visuals:
      enum.TeslaCoilVisuals.Enabled:
        enabled:
          True: { state: coil }
          False: { state: coil }
  - type: PointLight
    radius: 2.5
    energy: 0.7
    color: "#64DA45"

