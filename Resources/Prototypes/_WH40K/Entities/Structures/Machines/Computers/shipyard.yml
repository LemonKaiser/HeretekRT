- type: entity
  id: WH40KDropshipCarrierComputer
  parent: BaseCarrierComputer
  name: dropship hangar console
  description: A shipboard shipyard console for purchasing landing craft and small combat ships.
  suffix: WH40K, Carrier
  components:
  - type: ShipyardListing
    groups: []
    shuttles:
    - Aquila
    - RavenWh40k
    - Arvus
    - EagleWh40k
    - LightningWh40k
    - SharkWh40k
    - ThunderboltWh40k
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shipyard_nfsd
    - map: ["computerLayerKeys"]
      state: telesci_key

- type: entity
  id: WH40KChaosShipyardComputer
  parent: ComputerShipyardBase
  name: Chaos shipyard console
  description: The Red Sanctum's provisional shipyard terminal.
  suffix: WH40K, Chaos
  components:
  - type: ShipyardListing
    groups: []
    shuttles: [ ChaosArvusWh40k ]
  - type: ShipyardConsole
    canTransferDeed: false
  - type: CompanyAccessReader
    requiredCompanies: [ ChaosWarband ]
    popupMessage: wh40k-chaos-shipyard-access-denied
