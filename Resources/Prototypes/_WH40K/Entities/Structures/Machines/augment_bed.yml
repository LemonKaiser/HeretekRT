- type: entity
  parent: BaseMachinePowered
  id: WH40KAugmentationCapsule
  name: augmentation operating table
  description: An operating table that scans the patient's inventory and fits compatible implants and prostheses.
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Machines/augmentation_operating_table.rsi
    noRot: true
    enableOverrideDir: true
    overrideDir: South
    drawdepth: BelowMobs
    state: operating_table
  - type: Icon
    sprite: _WH40K/Structures/Machines/augmentation_operating_table.rsi
    state: operating_table
  - type: Appearance
  - type: Strap
    position: Down
    rotation: 90
    buckleOffset: "0,0.125"
  - type: Transform
    anchored: true
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 190
        mask:
        - TableMask
        layer: []
  - type: Wh40kAugmentBed
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: UserInterface
    interfaces:
      enum.Wh40kAugmentBedKey.Key:
        type: Content.Client._WH40K.Augments.Wh40kAugmentBedBui

- type: entity
  parent: WH40KAugmentationCapsule
  id: WH40KAugmentationCapsuleImperium
  name: Imperial augmentation operating table
  description: An Imperial operating table for fitting implants and prostheses.
  components:
  - type: Sprite
    overrideDir: North

- type: entity
  parent: WH40KAugmentationCapsule
  id: WH40KAugmentationCapsuleChaos
  name: Chaos augmentation operating table
  description: A bloodied operating table for fitting implants and prostheses.
  components:
  - type: Sprite
    overrideDir: North
    state: operating_table_bloody
  - type: Icon
    state: operating_table_bloody

- type: entity
  parent: WH40KAugmentationCapsule
  id: WH40KAugmentationCapsuleDamaged
  name: bloodied augmentation operating table
  description: A bloodstained table fitted with restraints and surgical tools.
  components:
  - type: Sprite
    state: operating_table_bloody
  - type: Icon
    state: operating_table_bloody

- type: entity
  parent: WH40KAugmentationCapsule
  id: WH40KAugmentationBed
  categories: [ HideSpawnMenu ]

- type: entity
  parent: WH40KDecorPropBase
  id: WH40KDecorChirurgeonServitor
  name: surgical servitor
  description: A stationary surgical servitor fitted with a set of mechanical instruments.
  suffix: WH40K, Decor, Right
  components:
  - type: Sprite
    sprite: _WH40K/Structures/Decorations/chirurgeon_servitor.rsi
    drawdepth: Items
    state: right

- type: entity
  parent: WH40KDecorChirurgeonServitor
  id: WH40KDecorChirurgeonServitorLeft
  suffix: WH40K, Decor, Left
  components:
  - type: Sprite
    state: left
