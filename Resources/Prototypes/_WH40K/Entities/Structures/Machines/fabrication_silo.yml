- type: entity
  id: Wh40kBaseFabricationSilo
  abstract: true
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: fabrication silo
  components:
  - type: Sprite
    sprite: Structures/Machines/silo.rsi
    snapCardinals: true
    layers:
    - state: silo
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        base:
          True: { state: silo_active }
          False: { state: silo }
  - type: Wh40kFabricationSilo
  - type: ActivatableUI
    key: enum.OreSiloUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.OreSiloUiKey.Key:
        type: Wh40kFabricationSiloBoundUserInterface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask: [MachineMask]
        layer: [MachineLayer]
  - type: WiresVisuals
  - type: WiresPanel
  - type: StaticPrice
    price: 1500

- type: entity
  id: Wh40kMachinePartsSilo
  parent: Wh40kBaseFabricationSilo
  name: parts silo
  description: Stores precursor components and supplies them to linked fabrication machines. Use a component on it, or dump a bag into it, to deposit components that fabrication machines use.
  components:
  - type: Wh40kFabricationSilo
    kind: Parts
  - type: Sprite
    sprite: _WH40K/Lathe/parts_silo.rsi
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      fabrication_parts: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - fabrication_parts
  - type: Machine
    board: Wh40kPartsSiloMachineCircuitboard

- type: entity
  id: Wh40kMachineChemicalSilo
  parent: Wh40kBaseFabricationSilo
  name: chemical silo
  description: Stores up to 1500u of chemicals without letting them react and supplies them to linked fabrication machines. Pour in chemicals that fabrication machines use with a beaker, jug, jerry can or syringe; withdraw them one at a time into an inserted beaker.
  components:
  - type: Wh40kFabricationSilo
    kind: Chemicals
  - type: Sprite
    sprite: _WH40K/Lathe/chemical_silo.rsi
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 1500
        canReact: false
  - type: RefillableSolution
    solution: tank
    preventTransferOut: true
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      beakerSlot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      beakerSlot:
        insertOnInteract: false
        ejectOnBreak: true
        whitelist:
          components:
          - FitsInDispenser
  - type: ExaminableSolution
    solution: tank
  - type: Machine
    board: Wh40kChemicalSiloMachineCircuitboard

- type: entity
  id: Wh40kPartsSiloMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: parts silo machine board
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: Wh40kMachinePartsSilo
    requirements:
      MatterBin: 4
    stackRequirements:
      Cable: 1
    tagRequirements:
      MicroprocessorEconomy1:
        amount: 1
        defaultPrototype: MicroprocessorEconomy1
      ComponentBrickEconomy1:
        amount: 4
        defaultPrototype: ComponentBrickEconomy1

- type: entity
  id: Wh40kChemicalSiloMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: chemical silo machine board
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: Wh40kMachineChemicalSilo
    requirements:
      MatterBin: 4
    stackRequirements:
      Cable: 1
    tagRequirements:
      MicroprocessorEconomy1:
        amount: 1
        defaultPrototype: MicroprocessorEconomy1
      ComponentBrickEconomy1:
        amount: 4
        defaultPrototype: ComponentBrickEconomy1

- type: entity
  parent: BaseNFFlatpack
  id: Wh40kPartsSiloFlatpack
  name: parts silo flatpack
  description: A flatpack used for constructing a parts silo.
  components:
  - type: Flatpack
    entity: Wh40kMachinePartsSilo
  - type: StaticPrice
    price: 400

- type: entity
  parent: BaseNFFlatpack
  id: Wh40kChemicalSiloFlatpack
  name: chemical silo flatpack
  description: A flatpack used for constructing a chemical silo.
  components:
  - type: Flatpack
    entity: Wh40kMachineChemicalSilo
  - type: StaticPrice
    price: 400
