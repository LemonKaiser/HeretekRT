# Imperial Navy ship artillery: lance cannons and macro-cannons

- type: entity
  id: WeaponTurretWH40KLanceCannon
  parent:
  - BallisticArtillery
  - BallisticArtilleryTier4HP
  suffix: WH40K, Военный Флот, T4
  components:
  - type: StaticPrice
    price: 25000
  - type: Sprite
    sprite: _WH40K/Structures/Shuttles/Weapons/lancecannon.rsi
    layers:
    - state: space_artillery
    scale: 1, 1
  - type: Appearance
  - type: DamageVisuals
    thresholds: [1, 2, 3]
    damageDivisor: 2500
    trackAllDamage: true
    damageOverlay:
      sprite: _WH40K/Structures/Shuttles/Weapons/lancecannon.rsi
  - type: AmmoCounter
  - type: FireControlRotate
  - type: Battery
    maxCharge: 50000
    startingCharge: 50000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 4500
  - type: ExaminableBattery
  - type: WirelessNetworkConnection
    range: 500
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-0.6,0.6,0.6"
        density: 1500
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Gun
    fireRate: 0.5
    recoil: 15
    minAngle: 0
    maxAngle: 0
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    shootThermalSignature: 6000000
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_perforator.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: SpaceArtillery
    powerChargeRate: 25000
    powerUsePassive: 1200
    powerUseActive: 0
  - type: Actions
  - type: HitscanBatteryAmmoProvider
    proto: PrometheusLaser
    fireCost: 6000
  - type: RadarBlip
    radarColor: "#C92BCC"
    scale: 2.5
    visibleFromOtherGrids: true
    gridConfig:
      color: "#C92BCC"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-1.5,-1.5,1.5,1.5"
  - type: ShipGunType
    shipType: Energy
  - type: ShipGunClass
    shipClass: Heavy
  - type: ShipRepairable
    repairTime: 35
    repairCost: 150
  - type: HardpointAnchorableOnly
    class: Energy
    size: Heavy

