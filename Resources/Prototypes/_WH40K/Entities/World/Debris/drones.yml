- type: entity
  id: SpawnWH40KDroneMavic
  parent: SpawnDroneBase
  name: hostile AI drone Mavic spawner
  suffix: WH40K, T0
  categories: [Spawner]
  components:
  - type: GridSpawner
    path: /SharedMaps/_WH40K/Drones/drone_t0.yml
    addComponents:
    - type: RandomMetadata
      nameSeparator: ""
      nameSegments:
      - wh40k-drone-mavic-name
      - " 0x"
      - DroneHex
      - DroneHex
      - DroneHex
      - DroneHex
      - DroneHex
      - DroneHex
    nameGrid: false

