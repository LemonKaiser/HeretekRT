- type: entity
  id: WH40KHostileDronePatrol
  parent: BluespaceSyndicateFTLInterception
  name: hostile AI drone patrol
  components:
  - type: BluespaceErrorRule
    groups:
      grid: !type:GridSpawnGroup
        nameLoc: []
        nameGrid: false
        minimumDistance: 1500
        maximumDistance: 2500
        addComponents:
        - type: IFF
          flags: AlwaysShowColor
          color: "#C6A692"
        - type: LinkedLifecycleGridParent
        paths:
        - /SharedMaps/_WH40K/Drones/drone_t0.yml
        - /SharedMaps/_WH40K/Drones/drone_t1.yml
        - /SharedMaps/_WH40K/Drones/drone_t1_1.yml
        - /SharedMaps/_WH40K/Drones/drone_t2.yml

