# Visual cult decorations adapted from Arcane. They intentionally omit Wraith,
# Heretic and portal components, so they cannot summon mobs or perform rituals.

- type: entity
  id: WH40KBloodRitualBase
  abstract: true
  parent: BaseStructure
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  # Blood writing and ritual markings are floor decorations, not solid structures.
  # Do not inherit BaseStructure's default blocking fixture.
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures: {}
  - type: Sprite
    noRot: true
    drawdepth: FloorObjects
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: WH40KBloodRitualRune
  parent: WH40KBloodRitualBase
  name: blood ritual rune
  description: A sinister rune drawn in fresh blood.
  components:
  - type: Sprite
    sprite: _WH40K/Imported/Cult/Goobstation/Heretic/ritual_rune.rsi
    state: icon
    drawdepth: WallMountedItems
  - type: Construction
    graph: WH40KBloodDecorations
    node: bloodRune

- type: entity
  id: WH40KBloodRitualRuneAnimated
  parent: WH40KBloodRitualBase
  name: animated blood ritual rune
  description: A blood rune repeatedly draws itself in an unsettling pattern.
  components:
  - type: Sprite
    sprite: _WH40K/Imported/Cult/Goobstation/Heretic/ritual_rune.rsi
    state: icon_ritualanim
    drawdepth: WallMountedItems
  - type: PointLight
    radius: 2
    energy: 0.8
    color: "#990000"
  - type: Construction
    graph: WH40KBloodDecorations
    node: animatedBloodRune

