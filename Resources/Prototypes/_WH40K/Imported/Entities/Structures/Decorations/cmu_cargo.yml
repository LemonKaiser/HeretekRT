          True: { state: powerloader_overlay_jd }
          False: { state: powerloader_open_jd }

- type: entity
  id: WH40KCMUPowerLoaderBlue
  parent: WH40KCMUPowerLoaderBase
  suffix: CMU, Decor
  components:
  - type: Sprite
    layers:
    - state: powerloader_open_ft
      map: [ "base" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        base:
          True: { state: powerloader_overlay_ft }
          False: { state: powerloader_open_ft }

- type: entity
  id: WH40KCMUPowerLoaderWreckYellow
  parent: WH40KCMUCargoDecorBase
  suffix: CMU, Decor
  components:
  - type: Sprite
    sprite: _WH40K/Imported/RMC14/Structures/Cargo/power_loader.rsi
    drawdepth: BelowMobs
