# Decorative flags and banners imported from CMU14 and RMC14.

- type: entity
  id: WH40KCMURMCBannerBase
  parent: BaseFlag
  abstract: true
  suffix: CMU, Decor
  components:
  - type: Sprite
    sprite: _WH40K/Imported/RMC14/Structures/Flags/banners.rsi
    drawdepth: WallTops

- type: entity
  id: WH40KCMUWallFlagBase
  parent: BaseFlag
  abstract: true
  suffix: CMU, Decor
  components:
  - type: Sprite
    sprite: _WH40K/Imported/CMU14/Structures/Flags/wallflags.rsi
    drawdepth: WallTops

- type: entity
  id: WH40KCMUStandingFlagBase
  parent: BaseStructure
  abstract: true
  suffix: CMU, Decor
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 150
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - HighImpassable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  id: WH40KCMUDeskFlagBase
  parent: BaseStructure
  abstract: true
  suffix: CMU, Decor
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Physics
    bodyType: Static
    canCollide: false

