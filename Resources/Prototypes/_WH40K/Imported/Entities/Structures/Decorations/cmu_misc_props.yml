# Miscellaneous field, military, memorial and lab decorative props from CMU14 and RMC14.

- type: entity
  id: WH40KCMUMiscDecorBase
  parent: BaseStructure
  abstract: true
  suffix: CMU, Decor
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

# Field / FOB Props
- type: entity
  id: WH40KCMUFieldGenerator
  parent: WH40KCMUMiscDecorBase
  suffix: CMU, Decor
  components:
  - type: Sprite
    sprite: _WH40K/Imported/CMU14/Structures/Misc/backup_generator.rsi
    layers:
    - state: backup_generator_on
      map: [ "base" ]
  - type: Appearance
  - type: ItemToggle
    onActivate: true
    onUse: false
    activated: true
    soundActivate:
      path: /Audio/Machines/button.ogg
    soundDeactivate:
      path: /Audio/Machines/button.ogg
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        base:
          True: { state: backup_generator_on }
          False: { state: backup_generator }

- type: entity
  id: WH40KCMUFieldFloodlight
  parent: WH40KCMUMiscDecorBase
  suffix: CMU, Decor
  components:
