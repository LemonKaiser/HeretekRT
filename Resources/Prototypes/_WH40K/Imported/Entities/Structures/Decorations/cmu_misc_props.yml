      map: [ "base" ]
  - type: Appearance
  - type: ItemToggle
    onActivate: true
    onUse: false
    activated: true
    soundActivate:
      path: /Audio/Machines/button.ogg
    soundDeactivate:
      path: /Audio/Machines/button.ogg
  - type: ItemTogglePointLight
