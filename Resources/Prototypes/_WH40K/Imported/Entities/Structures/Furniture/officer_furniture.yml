# Imported decorative furniture. Kept free of the healing behavior present in the source fork.

- type: entity
  id: WH40KImportedSeatBase
  abstract: true
  parent: [SeatBase, BaseStructure]
  description: A comfortable piece of furniture.
  components:
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Rotatable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
        density: 190
        mask:
        - TableMask
  - type: Strap
    position: Down
    rotation: 0

- type: entity
  id: WH40KImportedSofaBase
  abstract: true
  parent: WH40KImportedSeatBase

- type: entity
  id: WH40KLeatherSofaLeft
  parent: WH40KImportedSofaBase
  name: leather sofa, left section
  components:
  - type: Sprite
    sprite: _WH40K/Imported/ADT/Structures/Furniture/Sofas/leather_sofa.rsi
    state: sofa_left
  - type: Construction
    graph: WH40KImportedSeat
    node: leatherSofaLeft

