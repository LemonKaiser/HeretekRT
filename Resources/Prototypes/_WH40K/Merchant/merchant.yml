- type: htnCompound
  id: WH40KMerchantIdleCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime

- type: entity
  id: MarkerWH40KMerchantSpawn
  parent: MarkerWH40KFootfallNpcBase
  name: wh40k-footfall-market-kass-marker
  description: Торговец возвращается сюда, если его унесло дальше трёх тайлов.
  suffix: WH40K, Merchant, Mapping
  components:
  - type: MerchantSpawnMarker
  - type: Wh40kNpcAnchor
    anchor: FootfallKass

- type: entity
  id: MobWH40KFootfallMerchant
  parent: MobHuman
  name: wh40k-footfall-market-kass-name
  description: wh40k-footfall-market-kass-desc
  suffix: WH40K, Merchant
  save: false
  components:
  - type: Wh40kNpcProtection
  - type: RandomHumanoidAppearance
    randomizeName: false
    hair: HairBald
  - type: Loadout
    prototypes:
    - WH40KFootfallSmugglerKassGear
  - type: HTN
    rootTask:
      task: WH40KMerchantIdleCompound
    # Keep the HTN awake on the station. It only waits in place; MerchantSystem
    # handles turning toward the nearest player without starting a movement plan.
    sleepPlayerCheckRangeOverride: 1000000
  - type: Godmode
  - type: UserInterface
    interfaces:
      enum.MerchantUiKey.Key:
        type: MerchantBoundUserInterface
        interactionRange: 3
  - type: Merchant
    title: wh40k-footfall-market-kass-title
    greeting: wh40k-footfall-market-kass-intro
    refreshInterval: 900
    displayCount: 6
    interactionRange: 3
    lookAtRange: 1
    returnDistance: 3
    offers:
    - product: Emag
      price: 1000
      minStock: 2
      maxStock: 2
    - product: RadioJammer
      price: 600
      minStock: 3
      maxStock: 3
    - product: ClothingHeadsetVoxBackpackHeretics
      price: 280
      minStock: 4
      maxStock: 4
    - product: EncryptionKeyVoxHeretics
      price: 180
      minStock: 4
      maxStock: 4
    - product: ChaosMedkit
      price: 350
      minStock: 4
      maxStock: 4
    - product: ClothingNeckCloakRainChs
      price: 240
      minStock: 4
      maxStock: 4
  - type: DialogueInteractable
    interactionRange: 3
    requireLineOfSight: true
    dialogue: WH40KFootfallKassMarket
  - type: Wh40kNpcIdentity
    anchor: FootfallKass
