- type: utilityQuery
  id: Wh40kChaosCombatTargets
  query:
  - !type:NearbyHostilesQuery
  considerations:
  - !type:TargetIsAliveOrNACon
    curve: !type:BoolCurve
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: TargetDistance
  - !type:TargetHealthCon
    curve: !type:PresetCurve
      preset: TargetHealth
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve

- type: htnCompound
  id: Wh40kChaosRangedCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:Wh40kChaosSelectTargetOperator
    - !type:HTNPrimitiveTask
      operator: !type:Wh40kChaosCombatOperator
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:Wh40kChaosPatrolOperator
      preconditions:
      - !type:BuckledPrecondition
        isBuckled: false
      - !type:PulledPrecondition
        isPulled: false
    - !type:HTNCompoundTask
      task: IdleSpinCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleSpinCompound
