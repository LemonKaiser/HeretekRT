- type: startingGear
  id: WH40KAgriWorldBotanyMerchantGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitVoidsman
    outerClothing: ClothingOuterWorkSuitImperialCitizen
    shoes: ClothingShoesAnkleBoots

- type: startingGear
  id: WH40KResortMerchantGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitImperialCitizenVest
    shoes: ClothingShoesColorBlack

- type: entity
  abstract: true
  parent: MobWH40KFootfallNpcBase
  id: MobWH40KPlanetMerchantBase
  save: true
  components:
  - type: UserInterface
    interfaces:
      enum.MerchantUiKey.Key:
        type: MerchantBoundUserInterface
        interactionRange: 3
  - type: DialogueInteractable
    dialogue: WH40KPlanetMerchant
    interactionRange: 3
    maxDialogueRange: 3
    requireLineOfSight: true
  - type: Merchant
    greeting: wh40k-planet-merchant-greeting

- type: entity
  parent: MobWH40KPlanetMerchantBase
  id: MobWH40KAgriWorldBotanyMerchant
  name: botany merchant
  description: An agri-world supplier of seeds and growing supplies.
  suffix: WH40K, Agri-world
  components:
  - type: Loadout
    prototypes: [WH40KAgriWorldBotanyMerchantGear]
  - type: Merchant
    title: ent-MobWH40KAgriWorldBotanyMerchant
    offers:
    - product: WheatSeeds
      price: 25

- type: entity
  parent: MobWH40KPlanetMerchantBase
  id: MobWH40KResortLuxuryMerchant
  name: luxury goods merchant
  description: A jeweller and dealer in luxury goods catering to resort guests.
  suffix: WH40K, Resort world
  components:
  - type: Loadout
    prototypes: [WH40KResortMerchantGear]
  - type: Merchant
    title: ent-MobWH40KResortLuxuryMerchant
    offers:
    - product: GoldRingDiamond
      price: 1800

- type: entity
  parent: MobWH40KPlanetMerchantBase
  id: MobWH40KResortFineFoodMerchant
  name: fine food merchant
  description: A delicatessen vendor serving visitors to the resort.
  suffix: WH40K, Resort world
  components:
  - type: Loadout
    prototypes: [WH40KResortMerchantGear]
  - type: Merchant
    title: ent-MobWH40KResortFineFoodMerchant
    offers:
    - product: FoodSoupEscargot
      price: 110

- type: entity
  parent: MobWH40KPlanetMerchantBase
  id: MobWH40KResortLuxuryClothingMerchant
  name: luxury clothing merchant
  description: An outfitter selling formalwear to the resort's guests.
  suffix: WH40K, Resort world
  components:
  - type: Loadout
    prototypes: [WH40KResortMerchantGear]
  - type: Merchant
    title: ent-MobWH40KResortLuxuryClothingMerchant
    offers:
    - product: ClothingUniformJumpskirtBlackElegantDress
      price: 350
