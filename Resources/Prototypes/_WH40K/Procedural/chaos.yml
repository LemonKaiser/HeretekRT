  - id: WH40KAirlockChaosDungeon

- type: entitySpawnEntry
  id: WH40KChaosDungeonLights
  entries:
  - id: AlwaysPoweredlightRed

- type: entitySpawnEntry
  id: WH40KChaosDungeonColumns
