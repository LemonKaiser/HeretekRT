- type: Tag
  id: WH40KChaosDungeon

- type: dungeonConfig
  id: WH40KChaosDungeon
  data:
    colors:
      Decals: "#8C191E97"
    entities:
      Cabling: CableApcExtension
      CornerWalls: WallMetalChaosBrick
      Walls: WallMetalChaosBrick
    spawnGroups:
      CornerClutter: WH40KChaosDungeonColumns
      Entrance: WH40KChaosDungeonEntrance
      WallMounts: WH40KChaosDungeonLights
    tiles:
      FallbackTile: FloorDark
    whitelists:
      Rooms:
        tags:
        - WH40KChaosDungeon
  layers:
  - !type:PrefabDunGen
    presets:
    - Bucket
    - Wow
    - SpaceShip
    - Tall
  - !type:CorridorDunGen
    width: 3
  - !type:DungeonEntranceDunGen
    count: 2
  - !type:RoomEntranceDunGen
  - !type:BoundaryWallDunGen
  - !type:CorridorDecalSkirtingDunGen
    cardinalDecals:
      South: ADTTileBrickTileSteelLineS
      East: ADTTileBrickTileSteelLineE
      North: ADTTileBrickTileSteelLineN
      West: ADTTileBrickTileSteelLineW
    cornerDecals:
      SouthEast: ADTTileBrickTileSteelCornerSe
      SouthWest: ADTTileBrickTileSteelCornerSw
      NorthEast: ADTTileBrickTileSteelCornerNe
      NorthWest: ADTTileBrickTileSteelCornerNw
    pocketDecals:
      SouthWest: ADTTileBrickTileSteelInnerSw
      SouthEast: ADTTileBrickTileSteelInnerSe
      NorthWest: ADTTileBrickTileSteelInnerNw
      NorthEast: ADTTileBrickTileSteelInnerNe
  - !type:CornerClutterDunGen
    chance: 1
    preservePassages: true
  - !type:WallMountDunGen
    mountInside: true
    minSpacing: 6
    prob: 1
  - !type:AutoCablingDunGen
  - !type:CorridorClutterDunGen
    chance: 0.08
    contents:
    - id: N14DecorFloorBoard6
      prob: 0.4
      orGroup: debris
    - id: N14DecorFloorBoard13
      prob: 0.4
      orGroup: debris
    - id: N14DecorFloorBrickrubble
      prob: 0.4
      orGroup: debris
    - id: N14DecorFloorPaper2
      prob: 1.5
      orGroup: debris
    - id: N14DecorFloorPaper3
      orGroup: debris
    - id: N14DecorFloorCardboard
      prob: 0.8
      orGroup: debris
    - id: N14DecorFloorScrapwood
      prob: 0.6
      orGroup: debris
    - id: N14DecorFloorGlass3
      prob: 0.5
      orGroup: debris
    - id: N14DecorFloorGlass1
      prob: 0.4
      orGroup: debris
    - id: N14DecorFloorFood4
      prob: 0.2
      orGroup: debris
    - id: N14DecorFloorSkeleton
      prob: 0.15
      orGroup: debris
    - id: N14DecorFloorBookPile4
      prob: 0.25
      orGroup: debris
    - id: N14DecorFloorBookstack1
      prob: 0.25
      orGroup: debris

- type: entitySpawnEntry
  id: WH40KChaosDungeonEntrance
