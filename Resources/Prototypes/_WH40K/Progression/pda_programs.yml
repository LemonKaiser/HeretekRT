- type: entity
  parent: NFBasePDACartridge
  id: Wh40kPlayerCartridge
  name: RPG player program
  description: A personal account progression panel.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi
    state: cart-y
  - type: UIFragment
    ui: !type:Wh40kPlayerUi
  - type: Cartridge
    programName: wh40k-rpg-player-program-name
    icon: /Textures/_WH40K/Interface/PDA/Applications/player.png
    readonly: true
  - type: Wh40kPlayerCartridge

- type: entity
  parent: NFBasePDACartridge
  id: Wh40kPartyCartridge
  name: RPG party program
  description: A personal party management panel.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi
    state: cart-nav
  - type: UIFragment
    ui: !type:Wh40kPartyUi
  - type: Cartridge
    programName: wh40k-rpg-party-program-name
    icon: /Textures/_WH40K/Interface/PDA/Applications/party.png
    readonly: true
  - type: Wh40kPartyCartridge

- type: entity
  parent: NFBasePDACartridge
  id: Wh40kClassCartridge
  name: RPG class program
  description: A private, server-authoritative class progression tree.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridge.rsi
    state: cart-y
  - type: UIFragment
    ui: !type:Wh40kClassUi
  - type: Cartridge
    programName: wh40k-rpg-class-program-name
    icon: /Textures/_WH40K/CharacterCreation/Ornaments/cog-sigil.svg.192dpi.png
    readonly: true
  - type: Wh40kClassCartridge
