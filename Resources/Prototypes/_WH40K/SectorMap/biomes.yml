# Pale sand with sparse, sun-bleached vegetation at small oases.
- type: biomeTemplate
  id: KoronusPaleDesert
  layers:
  - !type:BiomeEntityLayer
    threshold: -1
    allowedTiles: [FloorKoronusQuicksand]
    entities: [KoronusQuicksand]
  - !type:BiomeEntityLayer
    threshold: 0.87
    noise:
      seed: 3
      noiseType: OpenSimplex2
      frequency: 0.8
    allowedTiles: [KoronusOasisDryGrass]
    entities: [KoronusDesertDryGrass]
  - !type:BiomeEntityLayer
    threshold: 0.87
    noise:
      seed: 5
      noiseType: OpenSimplex2
      frequency: 0.6
    allowedTiles: [CMPlanetSand]
    entities: [KoronusDesertCactus, KoronusDesertCactus, KoronusDesertBarrelCactus, RMCCactus2]
  - !type:BiomeMetaLayer
    template: KoronusOasisPalms
    threshold: 0.935
    noise:
      seed: 41
      noiseType: OpenSimplex2
      frequency: 0.03
  - !type:BiomeEntityLayer
    threshold: 0.48
    noise:
      seed: 13
      noiseType: OpenSimplex2
      fractalType: FBm
      octaves: 3
      frequency: 0.035
    allowedTiles: [CMPlanetSand]
    entities: [WallRock]
  - !type:BiomeEntityLayer
    threshold: -1
    allowedTiles: [FloorRiverbed]
    entities: [FloorWaterEntity]
  - !type:BiomeDummyLayer
    id: Loot
  - !type:BiomeTileLayer
    threshold: -1
    tile: CMPlanetSand
  # Separate, broad pockets leave ordinary sand between the hazards.
  - !type:BiomeTileLayer
    threshold: 0.62
    tile: FloorKoronusQuicksand
    noise:
      seed: 47
      noiseType: OpenSimplex2
      frequency: 0.045
  # Matching noise confines the dry grass to a narrow fringe around the water peaks.
  - !type:BiomeTileLayer
    threshold: 0.91
    tile: KoronusOasisDryGrass
    noise:
      seed: 41
      noiseType: OpenSimplex2
      frequency: 0.03
  - !type:BiomeTileLayer
    threshold: 0.94
    tile: FloorRiverbed
    noise:
      seed: 41
      noiseType: OpenSimplex2
      frequency: 0.03

