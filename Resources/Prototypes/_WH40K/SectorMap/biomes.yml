- type: biomeTemplate
  id: KoronusRockCaves
  layers:
  - !type:BiomeEntityLayer
    threshold: 0.95
    noise:
      seed: 1
      noiseType: OpenSimplex2
      frequency: 1
    allowedTiles:
    - FloorCave
    entities:
    - FloraGreyStalagmite
  - !type:BiomeEntityLayer
    threshold: 0.84
    noise:
      seed: 7
      noiseType: OpenSimplex2
      frequency: 0.8
    allowedTiles:
    - FloorCave
    - FloorCaveDrought
    entities:
    - FloraRockSolid
  - !type:BiomeEntityLayer
    threshold: 0.73
    noise:
      seed: 9
      noiseType: OpenSimplex2
      frequency: 0.7
    allowedTiles:
    - FloorCaveDrought
    entities:
    - FloraStalagmite
  - !type:BiomeEntityLayer
    threshold: -0.5
    invert: true
    noise:
      seed: 0
      noiseType: Perlin
      fractalType: Ridged
      octaves: 1
      frequency: 0.1
      gain: 0.5
    allowedTiles:
    - FloorCave
    - FloorCaveDrought
    entities:
    - WallRockBasalt
  - !type:BiomeDummyLayer
    id: Loot
  - !type:BiomeTileLayer
    threshold: -1
    tile: FloorCave
  - !type:BiomeTileLayer
    threshold: 0.24
    tile: FloorCaveDrought
    noise:
      seed: 6
      noiseType: OpenSimplex2
      fractalType: FBm
      octaves: 2
      frequency: 0.035

- type: biomeTemplate
  id: KoronusOasisPalms
  layers:
  - !type:BiomeEntityLayer
