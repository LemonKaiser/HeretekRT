- type: htnCompound
  id: KoronusHuntingTurretCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:KoronusHuntingTargetOperator
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      operator: !type:GunOperator
        targetKey: Target
        requireLOS: true
  - tasks:
    - !type:HTNCompoundTask
      task: IdleSpinCompound

- type: entity
  id: KoronusFoulstoneTurret
  parent: BaseWeaponTurret
  name: Foulstone defence turret
  description: A heavy automatic sentry that eliminates hostile fauna while allowing personnel to cross its line of fire safely.
  components:
  - type: KoronusHuntingTurret
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Turrets/heavy_turret.rsi
    drawdepth: Mobs
    layers:
    - state: syndie_lethal
  - type: HTN
    rootTask:
      task: KoronusHuntingTurretCompound
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Gun
    fireRate: 4.5
    projectileSpeed: 50
    minAngle: 0
    maxAngle: 0
    selectedMode: FullAuto
    availableModes: [FullAuto]
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/gun_sentry.ogg
  - type: BasicEntityAmmoProvider
    proto: KoronusHuntingBullet
    capacity: null
    count: null
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 750
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 10
            max: 20
  - type: StaticPrice
    price: 1500

- type: entity
  id: KoronusHuntingBullet
  parent: BaseBullet
  name: surface defence bullet
  categories: [HideSpawnMenu]
  components:
  - type: KoronusHuntingProjectile
  - type: Projectile
    damage:
      types:
        Piercing: 0
