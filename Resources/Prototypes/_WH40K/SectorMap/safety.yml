# Four protection policies. area applies to territory; station applies only to selected facility grids.
# A map-wide profile never grants station safeguards to arriving ships or procedural terrain.

# Footfall: protection across the entire space-system map.
- type: koronusSafetyProfile
  id: KoronusFootfallSystemProtection
  area:
    autoCleanupHostileNpcs: true
    blockShipWeapons: true
    blockPlayerDamage: true
    blockPlayerStaminaDamage: true
    blockPlayerPulling: true
    blockOtherPlayerStrip: true
    blockPlayerExplosions: true
    protectPlayerShipWires: true
    protectPlayerShipDeconstruction: true
    blockForcedBuckle: true
    blockPlayerHarmfulInteractions: true
    blockClassOffensiveActions: true

# Footfall: additional restrictions on explicitly configured public station grids.
- type: koronusSafetyProfile
  id: KoronusFootfallStationProtection
  station:
    protectStation: true
    protectNonHostileMobs: true
    autoCleanupHostileNpcs: true
    autoCleanPuddles: true
    blockMaintenancePanelScrewdriving: true
    blockAnchoring: true
    blockDeconstruction: true
    blockHandheldEntityPlacement: true
    blockStructureConstruction: true
    blockChemicalEffects: true
    blockRadiationMunitions: true
    blockPlayerDisposal: true
    blockAtmosphericRelease: true
    blockFireAndHighTemperature: true
    blockClassDeviceInteractions: true
    blockClassAreaEffects: true
    protectProperty: true
    lockInfrastructureControls: true
    anchorGrid: true
    blockArtifactTriggers: true
    blockNpcAttacks: true
    blockInfrastructureDamage: true

