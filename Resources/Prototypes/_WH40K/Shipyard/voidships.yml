# Imperial and Mechanicus voidships for the Koronus Expanse shipyard.

- type: vessel
  id: Aquila
  parent: BaseVessel
  name: Aquila-pattern Assault Shuttle
  description: A dependable Imperial drop craft built to carry soldiers, officers, and sacred cargo through hostile fire. Its compact frame and simple APU make it easy to keep flying far from a proper dockyard.
  price: 65000
  category: Small
  group: Shipyard
  shuttlePath: /SharedMaps/_Mono/Shuttles/WH40K/aquila.yml
  guidebookPage: null
  class:
  - Fighter
  - Escort
  engine:
  - APU

- type: gameMap
  id: Aquila
  mapName: 'Aquila-pattern Assault Shuttle'
  mapPath: /SharedMaps/_Mono/Shuttles/WH40K/aquila.yml
  minPlayers: 0
  stations:
    Aquila:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Aquila IMP{1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs:
          Contractor: [ 0, 0 ]

