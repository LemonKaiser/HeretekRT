- type: wolfWeatherSettings
  id: Wh40kWeatherDefault
  calmWindResponse: 6
  indoorSearch: 16
  indoorNear: 2
  indoorNearLevel: 0.4
  pushEnabled: true
  pushInterval: 0.5
  pushThreshold: 3
  pushRadius: 12
  pushMaxWeight: 2
  pushChance: 0.35
  pushStrength: 0.3
  pushMaxPerTick: 64

- type: entity
  id: Wh40kThunderbolt
  categories: [ HideSpawnMenu ]
  name: thunderbolt
  components:
  - type: Sprite
    sprite: /Textures/_WH40K/Effects/thunderbolt.rsi
    state: thunderbolt
    offset: 0, 1
    drawdepth: Effects
    noRot: true
    shader: unshaded
  - type: PointLight
    radius: 14
    energy: 10
    color: "#cfe4ff"
    netsync: false
  - type: TimedDespawn
    lifetime: 0.6

- type: entity
  parent: Wh40kThunderbolt
  id: Wh40kThunderboltFar
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/_WH40K/Effects/thunderbolt.rsi
    state: thunderbolt
    offset: 0, 1
    drawdepth: Effects
    noRot: true
    shader: unshaded
    color: "#dfe8ffcc"
  - type: PointLight
    radius: 10
    energy: 6
    color: "#cfe4ff"
    netsync: false

