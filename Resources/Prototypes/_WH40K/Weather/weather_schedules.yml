# Planetary weather schedules: 15-30 minute clear intervals, 5-10 minute active weather spells.

- type: weatherSchedule
  id: Wh40kWeatherTemperate
  gap:
    min: 15m
    max: 30m
  weathers:
  - weather: RainLight
    weight: 3
    duration:
      min: 5m
      max: 10m
  - weather: RainModerate
    weight: 2.5
    duration:
      min: 5m
      max: 10m
  - weather: FogWisps
    weight: 2
    duration:
      min: 5m
      max: 10m
  - weather: RainHeavy
    weight: 1.5
    duration:
      min: 5m
      max: 10m
    windAngle:
      min: 150
      max: 210
  - weather: FogBank
    weight: 1
    duration:
      min: 5m
      max: 10m
  - weather: Storm
    weight: 1
    duration:
      min: 5m
      max: 10m

