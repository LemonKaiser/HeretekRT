# Small sealable vials for liquid drugs and naloxone.

- type: entity
  parent: BaseChemistryEmptyVial
  id: Wh40kVial
  components:
  - type: Sprite
    sprite: _WH40K/WolfChem/Narcotics/Objects/vial.rsi
    layers:
    - state: icon_open
      map: [ "enum.OpenableVisuals.Layer" ]
    - state: fill-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: { state: icon_open }
          False: { state: icon }
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: fill-
    inHandsMaxFillLevels: 0
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 10
  - type: SolutionTransfer
    maxTransferAmount: 10
  - type: Construction
    graph: Wh40kVial
    node: vial
  - type: Openable
    opened: true
    closeable: true
    sound:
      collection: bottleOpenSounds
    closeSound:
      collection: bottleCloseSounds

- type: entity
  abstract: true
  parent: [ Wh40kVial, Wh40kNarcoticMarks ]
  id: Wh40kVialNarcoticBase
  components:
  - type: Openable
    opened: false
  - type: Tag
    tags:
    - CentrifugeCompatible
    - Wh40kNarcotic

- type: entity
  parent: Wh40kVialNarcoticBase
  id: Wh40kVialRedline
  suffix: Redline
  components:
  - type: Label
    currentLabel: wh40k-reagent-name-redline
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 10
        reagents:
        - ReagentId: Wh40kRedline
          Quantity: 10

