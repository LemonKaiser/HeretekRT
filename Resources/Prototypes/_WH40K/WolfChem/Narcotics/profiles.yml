- type: wh40kDrugProfile
  id: Wh40kChorus
  family: Psychedelic
  decay: 0.01
  rushGain: 2
  overdoseHalfLife: 120
  dependenceGain: 0.005
  tiers:
  - min: 1
    overlay: 0.4
    hallucinationChance: 0.05
    hallucinations: [ Whisper, Echo ]
  - min: 6
    overlay: 0.65
    hallucinationChance: 0.08
    hallucinations: [ Whisper, Echo, Glimpse, Phantom ]
  - min: 12
    overlay: 0.9
    hallucinationChance: 0.12
    hallucinations: [ Glimpse, Phantom, Echo, Whisper ]
    statusEffects:
    - key: Stutter
      component: ScrambledAccent
    effects:
    - !type:Drunk
      boozePower: 2
      slurSpeech: false
