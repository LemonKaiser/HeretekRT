# Drug profiles. Level is in effective units (units x grade x perUnit). The first tier is the light phase, the last
# the overdose, and any between are heavy; the screen look and a popup mark each step.

- type: wh40kDrugProfile
  id: Wh40kCocaine
  family: Stimulant
  decay: 0.01
  rushGain: 3
  overdoseHalfLife: 120
  dependenceGain: 0.015
  tiers:
  - min: 1
    speed: 1.1
    overlay: 0.35
    effects:
    - !type:Wh40kStaminaChange
      amount: -2
    - !type:PopupMessage
      probability: 0.05
      messages: [ wh40k-drug-popup-cocaine-1, wh40k-drug-popup-cocaine-2, wh40k-drug-popup-cocaine-3 ]
  - min: 8
    speed: 1.1
    overlay: 0.6
    effects:
    - !type:Wh40kStaminaChange
      amount: -2
    - !type:PopupMessage
      probability: 0.08
      visualType: SmallCaution
      messages: [ wh40k-drug-popup-anxious-1, wh40k-drug-popup-anxious-2 ]
  - min: 16
    overlay: 0.9
    effects:
    - !type:Jitter
      amplitude: 1
      frequency: 10
    - !type:Wh40kStrainHeart
      amount: 0.1
    - !type:HealthChange
      damage:
        types:
          Asphyxiation: 1
  crash:
    after: 30
    duration: 45
    perSecondAbove: 0.25
    speed: 0.9
    statusEffects:
    - key: Drowsiness
      component: Drowsiness
    stamina: 1
  neuroware:
    program: wh40k-neuroware-whiteline
    banner: wh40k-neuroware-whiteline-banner
    faults: [ wh40k-neuroware-whiteline-fault-1, wh40k-neuroware-whiteline-fault-2 ]

