# Opioid antagonist for reversing heroin, opium and fentanyl overdoses.
- type: reagent
  id: Wh40kNaloxone
  name: wh40k-reagent-name-naloxone
  group: Medicine
  desc: wh40k-reagent-desc-naloxone
  physicalDesc: reagent-physical-desc-clear
  flavor: bitter
  color: "#7dd3fc"
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
      - !type:Wh40kClearIntoxication
        family: Opioid
        amount: 4
      - !type:GenericStatusEffect
        key: Drowsiness
        time: 6
        type: Remove
      - !type:GenericStatusEffect
        key: ForcedSleep
        time: 4
        type: Remove
      - !type:HealthChange
        damage:
          types:
            Asphyxiation: -2
