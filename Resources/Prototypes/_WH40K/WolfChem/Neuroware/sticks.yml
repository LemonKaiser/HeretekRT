# Neuroware data sticks. A blank takes copies or encodes a drug; named sticks are pristine builds.

- type: entity
  parent: BaseItem
  id: Wh40kNeurowareStick
  components:
  - type: Sprite
    sprite: _WH40K/WolfChem/Neuroware/Objects/stick.rsi
    layers:
    - state: body
      color: "#8c8c90"
    - state: plug
    - state: tape
      map: [ "tape" ]
      visible: false
    - state: led
      shader: unshaded
      map: [ "led" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.Wh40kNeurowareStickVisuals.Copied:
        tape:
          True: { visible: true }
          False: { visible: false }
        led:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Tiny
  - type: Wh40kNeurowareStick
    loads: 0
  - type: StaticPrice
    price: 15

