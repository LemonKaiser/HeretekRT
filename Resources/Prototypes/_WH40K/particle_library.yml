# Reusable visual library. These prototypes only describe client cosmetics; gameplay systems
# decide when to emit them through ParticleSpawnSystem or a state-driven visualizer.

- type: particleEffect
  id: HrtParticleBaseImpact
  abstract: true
  sprite:
    sprite: _WH40K/Particles/generic.rsi
    state: dot
  shader: unshaded
  priority: Decorative
  cost: 0.55
  maxDistance: 18
  boundsRadius: 1.5
  startColor: "#FFFFFFFF"
  endColor: "#FFFFFF00"
  lifetime: 0.42
  lifetimeVariance: 0.16
  speed: 3.5
  speedVariance: 1.2
  particleSize: 0.16
  sizeVariance: 0.35
  emissionRate: 0
  maxCount: 16
  burst: true
  gravity: 4.5
  drag: 0.12
  spreadAngle: 150
  shape:
    type: CircleFill
    radius: 0.08

- type: particleEffect
  id: HrtParticleBaseDebris
  abstract: true
  parent: HrtParticleBaseImpact
  sprite:
    sprite: _WH40K/Particles/generic.rsi
    state: curl
  cost: 0.7
  maxDistance: 16
  boundsRadius: 1.8
  lifetime: 0.7
  lifetimeVariance: 0.25
  speed: 3.1
  speedVariance: 1.1
  particleSize: 0.19
  stretchFactor: 0.15
  maxCount: 14
  gravity: 7
  drag: 0.08
  startRotationVariance: 180
  rotationSpeedVariance: 540

- type: particleEffect
  id: HrtParticleBaseFluid
  abstract: true
  parent: HrtParticleBaseImpact
  sprite:
    sprite: _WH40K/Particles/generic.rsi
    state: drop
  cost: 0.65
  maxDistance: 16
  boundsRadius: 1.7
  lifetime: 0.75
  lifetimeVariance: 0.25
  speed: 2.7
  speedVariance: 0.9
  particleSize: 0.18
  sizeVariance: 0.25
  maxCount: 18
  gravity: 5.5
  drag: 0.12
  spreadAngle: 110

- type: particleEffect
  id: HrtParticleBaseSmokeBurst
  abstract: true
  sprite:
    sprite: Effects/chemsmoke.rsi
    state: chemsmoke
  priority: Decorative
  cost: 1.35
  maxDistance: 18
  boundsRadius: 2.5
  startColor: "#BFC4C6B0"
  endColor: "#BFC4C600"
  alphaOverLifetime:
    - time: 0.0
      value: 0.0
    - time: 0.12
      value: 1.0
    - time: 0.8
      value: 0.8
    - time: 1.0
      value: 0.0
  sizeOverLifetime:
    - time: 0.0
      value: 0.35
    - time: 1.0
      value: 1.4
  lifetime: 1.3
  lifetimeVariance: 0.4
  speed: 0.75
  speedVariance: 0.3
  particleSize: 0.33
  sizeVariance: 0.35
  emissionRate: 0
  maxCount: 14
  burst: true
  gravity: -0.24
  drag: 0.38
  noiseStrength: 0.1
  noiseFrequency: 0.65
  spreadAngle: 150
  startRotationVariance: 180
  rotationSpeedVariance: 35
  shape:
    type: CircleFill
    radius: 0.14

- type: particleEffect
  id: HrtParticleBaseSmokeContinuous
  abstract: true
  parent: HrtParticleBaseSmokeBurst
  emissionRate: 4
  maxCount: 18
  burst: false
  duration: 0

- type: particleEffect
  id: HrtParticleBaseEnergy
