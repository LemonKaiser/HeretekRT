# These entities are deliberate authoring tools. Search for "Частицы HRT" in the
# ordinary admin spawn menu, place one marker, and delete the marker when finished.

- type: entity
  id: HrtParticleSpawnerBase
  abstract: true
  categories: [Particles]
  name: Частицы HRT
  description: Косметический спавнер для предпросмотра эффекта частиц.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _WH40K/Particles/generic.rsi
    state: cross
    visible: false
  - type: ParticleEffectSpawner
    effect: HrtSparkles
  - type: Tag
    tags:
    - HideContextMenu

