<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" fill="none">
  <defs>
    <linearGradient id="chassis" x1="24" y1="6" x2="416" y2="554" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6B685D"/>
      <stop offset=".2" stop-color="#383B36"/>
      <stop offset=".56" stop-color="#242824"/>
      <stop offset="1" stop-color="#555448"/>
    </linearGradient>
    <linearGradient id="bezel" x1="220" y1="36" x2="220" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9A8B65"/>
      <stop offset=".14" stop-color="#4B4A3D"/>
      <stop offset=".5" stop-color="#191D1A"/>
      <stop offset=".86" stop-color="#34362D"/>
      <stop offset="1" stop-color="#887D5B"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="220" y1="54" x2="220" y2="486" gradientUnits="userSpaceOnUse">
      <stop stop-color="#456F52" stop-opacity=".58"/>
      <stop offset=".16" stop-color="#1B2B21" stop-opacity=".36"/>
      <stop offset=".84" stop-color="#111915" stop-opacity=".18"/>
      <stop offset="1" stop-color="#4E714F" stop-opacity=".46"/>
    </linearGradient>
    <radialGradient id="bolt" cx="0" cy="0" r="1" gradientTransform="translate(220 280) rotate(90) scale(5)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6D4A6"/>
      <stop offset=".28" stop-color="#A48E65"/>
      <stop offset=".62" stop-color="#4A4A40"/>
      <stop offset="1" stop-color="#161918"/>
    </radialGradient>
  </defs>

  <!-- Armoured portable chassis: deliberately original, with a dataslate-like silhouette. -->
  <path d="M29 2H411L438 29V531L411 558H29L2 531V29L29 2Z" fill="url(#chassis)" stroke="#111514" stroke-width="2"/>
  <path d="M34 9H406L431 34V526L406 551H34L9 526V34L34 9Z" stroke="#A1987D" stroke-opacity=".62" stroke-width="1.5"/>
  <path d="M425 35V525L405 545H35L15 525V35" stroke="#111413" stroke-width="2" stroke-linejoin="round"/>
  <path d="M30 14H116L92 38H17L30 14ZM410 14H324L348 38H423L410 14Z" fill="#252925" stroke="#81795F" stroke-width="1"/>

  <!-- Recessed, faceted viewport. The UI itself is drawn above this glass. -->
  <path d="M43 40H397L423 66V467L397 493H43L17 467V66L43 40Z" fill="#111612" stroke="#0D100F" stroke-width="5"/>
  <path d="M47 43H393L418 68V464L393 489H47L22 464V68L47 43Z" stroke="url(#bezel)" stroke-width="5"/>
  <path d="M56 52H384L409 77V455L384 480H56L31 455V77L56 52Z" fill="url(#screenGlow)" stroke="#82916F" stroke-opacity=".42" stroke-width="1.5"/>
  <path d="M63 58H377L402 83M38 450L63 475H377L402 450" stroke="#C0A76D" stroke-opacity=".56" stroke-width="1.2"/>

  <!-- Narrow machine vents: visible without stealing horizontal room from the terminal. -->
  <g fill="#151816" stroke="#81785E" stroke-opacity=".55" stroke-width=".7">
    <rect x="10" y="120" width="16" height="288" rx="6"/>
    <rect x="414" y="120" width="16" height="288" rx="6"/>
  </g>
  <g stroke="#B2A47B" stroke-opacity=".48" stroke-width="1">
    <path d="M14 136H22M14 148H22M14 160H22M14 172H22M14 184H22M14 196H22M14 208H22M14 220H22M14 232H22M14 244H22M14 256H22M14 268H22M14 280H22M14 292H22M14 304H22M14 316H22M14 328H22M14 340H22M14 352H22M14 364H22M14 376H22M14 388H22"/>
    <path d="M418 136H426M418 148H426M418 160H426M418 172H426M418 184H426M418 196H426M418 208H426M418 220H426M418 232H426M418 244H426M418 256H426M418 268H426M418 280H426M418 292H426M418 304H426M418 316H426M418 328H426M418 340H426M418 352H426M418 364H426M418 376H426M418 388H426"/>
  </g>

  <!-- Small top connection ports, deliberately clear of the title lockup. -->
  <rect x="250" y="12" width="56" height="21" rx="3" fill="#1B1E1B" stroke="#847A5F" stroke-opacity=".62" stroke-width="1"/>
  <g fill="#151817" stroke="#9B9071" stroke-width="1">
    <rect x="258" y="15" width="8" height="16" rx="4"/>
    <rect x="274" y="15" width="8" height="16" rx="4"/>
    <rect x="290" y="15" width="8" height="16" rx="4"/>
  </g>

  <!-- Lower service deck; it leaves the footer and device address readable. -->
  <path d="M42 505H398L410 517V531L394 546H46L30 531V517L42 505Z" fill="#252A25" fill-opacity=".9" stroke="#82795F" stroke-opacity=".75" stroke-width="1.4"/>
  <path d="M52 520H159L173 532 159 544H52L38 532 52 520ZM281 520H388L402 532 388 544H281L267 532 281 520Z" fill="#171B18" stroke="#5B604F" stroke-width="1"/>
  <g fill="#5E6F57">
    <circle cx="196" cy="531" r="2.2"/><circle cx="208" cy="531" r="2.2"/><circle cx="220" cy="531" r="2.2"/><circle cx="232" cy="531" r="2.2"/>
  </g>
  <circle cx="244" cy="531" r="2.4" fill="#59D68A"/>
  <circle cx="244" cy="531" r="4.5" stroke="#59D68A" stroke-opacity=".24" stroke-width="1.2"/>

  <!-- Fasteners and a single live indicator. -->
  <g fill="url(#bolt)" stroke="#111412" stroke-width="1.3">
    <circle cx="36" cy="27" r="5.2"/><circle cx="404" cy="27" r="5.2"/>
    <circle cx="24" cy="64" r="5.2"/><circle cx="416" cy="64" r="5.2"/>
    <circle cx="24" cy="496" r="5.2"/><circle cx="416" cy="496" r="5.2"/>
  </g>
</svg>
